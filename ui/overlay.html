<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSpeech Anzeige</title>
<style>
  :root {
    --grund: #14161B;
    --flaeche: #1C1F26;
    --erhoeht: #242832;
    --linie: #2E3340;
    --text: #E8E6E1;
    --leise: #8D93A1;
    --bernstein: #F2B24C;
    --tally: #FF5B4F;
    --bereit: #6FCF97;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding-bottom: 6px;
    color: var(--text);
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* Nur für die Vorschau im Browser, damit man die Pille sieht. */
  html.vorschau { background: #0B0C0F; }

  .pille {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 300px;
    height: 48px;
    padding: 0 18px;
    border: 1px solid var(--linie);
    border-radius: 24px;
    background: var(--flaeche);
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.14s ease-out, transform 0.14s ease-out, border-color 0.14s ease-out;
  }
  .pille:not([data-zustand="idle"]) { opacity: 1; transform: none; }
  .pille[data-zustand="error"] { border-color: var(--tally); }

  /* Live-Text über der Pille: zeigt immer das Ende, ältere Zeilen laufen oben raus. */
  .live {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    width: 520px;
    max-height: 86px;
    padding: 10px 16px 11px;
    overflow: hidden;
    border: 1px solid var(--linie);
    border-radius: 10px;
    background: var(--flaeche);
    font-size: 15px;
    line-height: 1.42;
    opacity: 0;
    transition: opacity 0.14s ease-out;
  }
  .live.sichtbar { opacity: 1; }
  .live.fertigt { color: var(--leise); }
  .live.voll {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
  }
  .live span { display: block; flex: none; overflow-wrap: anywhere; }

  .punkt {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: none;
  }
  .pille[data-zustand="recording"] .punkt {
    display: block;
    background: var(--tally);
    animation: puls 1.3s ease-in-out infinite;
  }
  .pille[data-zustand="loading"] .punkt {
    display: block;
    background: var(--bernstein);
    animation: blinken 1.1s steps(2, jump-none) infinite;
  }

  .schrift {
    display: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: Bahnschrift, "Segoe UI", sans-serif;
    font-stretch: 85%;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .pille[data-zustand="transcribing"] .schrift,
  .pille[data-zustand="loading"] .schrift { display: block; flex: none; }
  .pille[data-zustand="error"] .schrift {
    display: block;
    flex: 1;
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-stretch: 100%;
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }

  .balken {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    height: 26px;
    min-width: 0;
  }
  .pille[data-zustand="recording"] .balken,
  .pille[data-zustand="transcribing"] .balken { display: flex; }
  .balken i {
    display: block;
    width: 3px;
    height: 26px;
    border-radius: 1.5px;
    background: var(--bernstein);
    transform: scaleY(0.12);
    transition: transform 0.08s linear;
  }
  .pille[data-zustand="transcribing"] .balken i {
    transition: none;
    animation: lauf 1.5s ease-in-out infinite;
    animation-delay: calc(var(--i) * -70ms);
  }

  .zeit {
    display: none;
    flex: none;
    min-width: 4ch;
    text-align: right;
    color: var(--leise);
    font: 12px "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .pille[data-zustand="recording"] .zeit { display: block; }

  @keyframes puls { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes blinken { 0% { opacity: 1; } 100% { opacity: 0.25; } }
  @keyframes lauf {
    0%, 100% { transform: scaleY(0.14); opacity: 0.45; }
    50% { transform: scaleY(0.62); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pille { transition: none; }
    .punkt { animation: none !important; }
    .balken i { transition: none; }
    .pille[data-zustand="transcribing"] .balken i {
      animation: none;
      transform: scaleY(0.3);
      opacity: 0.7;
    }
  }
</style>
</head>
<body>
  <div class="live" id="live" aria-live="off"><span id="live-text"></span></div>
  <div class="pille" id="pille" data-zustand="idle" role="status" aria-live="polite">
    <span class="punkt" aria-hidden="true"></span>
    <span class="schrift" id="schrift"></span>
    <span class="balken" id="balken" aria-hidden="true"></span>
    <span class="zeit" id="zeit" aria-hidden="true">0:00</span>
  </div>

<script>
"use strict";
(function () {
  var ANZAHL = 24;
  var SCHRITT_MS = 66;                 // ein neuer Balken etwa 15-mal pro Sekunde

  var pille = document.getElementById("pille");
  var schrift = document.getElementById("schrift");
  var balkenBox = document.getElementById("balken");
  var zeit = document.getElementById("zeit");

  var balken = [];
  for (var i = 0; i < ANZAHL; i++) {
    var b = document.createElement("i");
    b.style.setProperty("--i", String(ANZAHL - i));
    balkenBox.appendChild(b);
    balken.push(b);
  }

  var zustand = "idle";
  var verlauf = [];
  var spitze = 0;
  var start = 0;
  var schubTimer = 0;
  var uhrTimer = 0;

  function leereVerlauf() {
    verlauf = [];
    for (var n = 0; n < ANZAHL; n++) verlauf.push(0);
    spitze = 0;
  }

  function zeichneBalken() {
    for (var n = 0; n < ANZAHL; n++) {
      balken[n].style.transform = "scaleY(" + (0.12 + 0.88 * verlauf[n]).toFixed(3) + ")";
    }
  }

  function loeseBalken() {
    for (var n = 0; n < ANZAHL; n++) balken[n].style.transform = "";
  }

  function zeichneZeit() {
    var s = Math.floor((performance.now() - start) / 1000);
    var text = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    if (zeit.textContent !== text) zeit.textContent = text;
  }

  function stoppeTakt() {
    clearInterval(schubTimer);
    clearInterval(uhrTimer);
    schubTimer = 0;
    uhrTimer = 0;
  }

  function setzeStatus(s) {
    var neu = s && s.state ? String(s.state) : "idle";
    var meldung = s && s.message ? String(s.message) : "";

    if (neu === "error") schrift.textContent = meldung || "Fehler";
    if (neu === zustand) return;        // der Status kommt oft, nur Wechsel zählen

    stoppeTakt();
    zustand = neu;
    pille.setAttribute("data-zustand", neu);
    // Beim Schreiben bleibt der letzte Zwischenstand gedimmt stehen, sonst weg damit.
    if (neu === "transcribing") live.classList.add("fertigt");
    else setzeLive("");

    if (neu === "recording") {
      schrift.textContent = "";
      leereVerlauf();
      zeichneBalken();
      start = performance.now();
      zeichneZeit();
      schubTimer = setInterval(function () {
        verlauf.shift();
        verlauf.push(Math.sqrt(Math.min(1, Math.max(0, spitze))));
        spitze = 0;
        zeichneBalken();
      }, SCHRITT_MS);
      uhrTimer = setInterval(zeichneZeit, 250);
    } else if (neu === "transcribing") {
      loeseBalken();
      schrift.textContent = "Schreibt …";
    } else if (neu === "loading") {
      schrift.textContent = "Lädt Modell …";
    } else if (neu !== "error") {
      loeseBalken();
    }
  }

  function setzePegel(v) {
    v = Number(v) || 0;
    if (v > spitze) spitze = v;
  }

  var live = document.getElementById("live");
  var liveText = document.getElementById("live-text");

  function setzeLive(text, gekuerzt) {
    text = text ? String(text) : "";
    live.classList.remove("fertigt");
    if (!text) {
      live.classList.remove("sichtbar", "voll");
      liveText.textContent = "";
      return;
    }
    liveText.textContent = (gekuerzt ? "… " : "") + text;
    live.classList.add("sichtbar");
    live.classList.toggle("voll", liveText.offsetHeight > live.clientHeight - 20);
  }

  if (window.__TAURI__) {
    var listen = window.__TAURI__.event.listen;
    var invoke = window.__TAURI__.core.invoke;
    listen("status", function (e) { setzeStatus(e.payload); });
    listen("level", function (e) { setzePegel(e.payload); });
    listen("partial", function (e) {
      if (zustand === "recording" && e.payload) setzeLive(e.payload.text, e.payload.cut);
    });
    // Falls das Fenster mitten in einer Aufnahme entsteht: Anfangszustand holen.
    Promise.resolve()
      .then(function () { return invoke("get_state"); })
      .then(function (snap) { if (snap && snap.status && zustand === "idle") setzeStatus(snap.status); })
      .catch(function () {});
  } else {
    // Vorschau im Browser: Schleife durch alle Zustände.
    document.documentElement.classList.add("vorschau");
    var schritte = [
      [{ state: "loading", message: "" }, 1800],
      [{ state: "recording", message: "" }, 5200],
      [{ state: "transcribing", message: "" }, 2400],
      [{ state: "idle", message: "" }, 900],
      [{ state: "error", message: "Mikrofon nicht gefunden: RODECaster Pro Stereo ist nicht angeschlossen." }, 3000],
      [{ state: "idle", message: "" }, 900]
    ];
    var nr = 0;
    var t = 0;
    var probe = "Das Koordinatennetz muss durchgehend sein und nicht einfach nur so, wie es jetzt ist. Und die Achsen sollen in beide Richtungen weiterlaufen, auch wenn ich ganz weit rauszoome.".split(" ");
    var worte = 0;
    setInterval(function () {
      if (zustand !== "recording") { worte = 0; return; }
      worte = Math.min(probe.length, worte + 2);
      setzeLive(probe.slice(0, worte).join(" "), false);
    }, 420);
    setInterval(function () {
      if (zustand !== "recording") return;
      t += 0.033;
      var silbe = Math.max(0, Math.sin(t * 7.3)) * (0.55 + 0.45 * Math.sin(t * 1.7));
      setzePegel(0.02 + 0.42 * silbe * (0.7 + Math.random() * 0.5));
    }, 33);
    (function weiter() {
      var schritt = schritte[nr++ % schritte.length];
      setzeStatus(schritt[0]);
      setTimeout(weiter, schritt[1]);
    })();
  }
})();
</script>
</body>
</html>
