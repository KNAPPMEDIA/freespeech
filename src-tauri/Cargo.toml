[package]
name = "freespeech"
version = "0.2.0"
description = "FreeSpeech: lokales Diktieren per Tastenkuerzel"
edition = "2021"
license = "MIT"
repository = "https://github.com/KNAPPMEDIA/freespeech"

[[bin]]
name = "FreeSpeech"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
arboard = "3"
dirs = "5"

# Windows: fertige Engine-DLLs aus ../engine, eingebunden ueber die lokalen Bindings.
[target.'cfg(windows)'.dependencies]
transcribe-cpp = { path = "../vendor/transcribe-cpp", features = ["dynamic-backends"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Media_Audio",
  "Win32_System_Threading",
] }

# Mac: dieselbe Engine-Version aus dem Quelltext (Metal), dazu die Mac-Teile.
[target.'cfg(target_os = "macos")'.dependencies]
# Anderer Schluessel als unter Windows, weil Cargo je Namen nur eine Quelle erlaubt;
# main.rs bindet ihn als `transcribe_cpp` ein.
transcribe-cpp-up = { package = "transcribe-cpp", version = "=0.4.2" }
fs-mac = { path = "../crates/fs-mac" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
