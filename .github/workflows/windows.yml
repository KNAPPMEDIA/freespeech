name: Windows-Build

# Baut den Windows-Installer aus dem Quelltext. Start von Hand oder mit einem Versions-Tag (v0.2.0).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer bauen (Tauri, NSIS)
        run: npx --yes @tauri-apps/cli@2 build

      - name: Pruefsumme schreiben
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -Append src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          }
          Get-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FreeSpeech-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
